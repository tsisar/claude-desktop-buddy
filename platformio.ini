; Two boards, two envs. The original M5StickC Plus build is unchanged; the
; Waveshare ESP32-S3-Touch-AMOLED-1.8 port lives alongside it. Pick one with
;   pio run -e m5stickc-plus
;   pio run -e ws-amoled-18

[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; --- Waveshare ESP32-S3-Touch-AMOLED-1.8 -----------------------------------
; ESP32-S3R8: 16MB QIO flash, 8MB OPI PSRAM. SH8601 AMOLED over QSPI,
; FT3168 touch + QMI8658 IMU + PCF85063 RTC + AXP2101 PMU on one I2C bus.
;
; Stage 2 (display bring-up) compiles ONLY the HAL + bringup translation unit.
; main.cpp and buddies/ still include <M5StickCPlus.h>, so they are excluded
; here until they're ported (stage 3+), then this filter widens.
[env:ws-amoled-18]
; pioarduino platform — packages arduino-esp32 core 3.x. The stock
; "espressif32" platform pins core 2.0.x, which lacks esp32-hal-periman.h
; that GFX Library for Arduino 1.4.x needs (build fails without it).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; ESP32-S3R8 = 16MB QIO flash + 8MB *octal* PSRAM. The esp32-s3-devkitc-1
; board defaults to qio_qspi (quad PSRAM) — wrong here, the boot log shows
; "quad_psram: chip not connected / wrong line mode" and the canvas alloc
; fails. memory_type qio_opi selects the octal-PSRAM bootloader.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
; ws-amoled uses the NimBLE bridge (ble_bridge_nimble.cpp); the Bluedroid
; ble_bridge.cpp is for the m5 build only.
;
; Stage switch — only one stage*_amoled.cpp may be in the filter at a time
; (each defines setup() / loop()).
;   stage3g — HAL sensors (IMU + RTC + PWRON)
;   stage3h — touch + gesture recognition
;   stage3i — backend (data_amoled.h + stats.h + RTC sync via BLE)
;   stage3j — UI shell: home (buddy + HUD) + approval screen + gestures ← current
;   stage3f — buddy alive over BLE
build_src_filter = +<hal/> +<audio/> +<buddies/> +<gesture.cpp> +<buddy_amoled.cpp> +<character_amoled.cpp> +<ble_bridge_nimble.cpp> +<stage3j_amoled.cpp>
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    lewisxhe/SensorLib @ ^0.2.4
    lewisxhe/XPowersLib @ ^0.2.6

; Waveshare ESP32-S3-Touch-AMOLED-1.8 firmware.
;   pio run -e ws-amoled-18

; --- Waveshare ESP32-S3-Touch-AMOLED-1.8 -----------------------------------
; ESP32-S3R8: 16MB QIO flash, 8MB OPI PSRAM. SH8601 AMOLED over QSPI,
; FT3168 touch + QMI8658 IMU + PCF85063 RTC + AXP2101 PMU on one I2C bus.
[env:ws-amoled-18]
; pioarduino platform — packages arduino-esp32 core 3.x. The stock
; "espressif32" platform pins core 2.0.x, which lacks esp32-hal-periman.h
; that GFX Library for Arduino 1.4.x needs (build fails without it).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; ESP32-S3R8 = 16MB QIO flash + 8MB *octal* PSRAM. The esp32-s3-devkitc-1
; board defaults to qio_qspi (quad PSRAM) — wrong here, the boot log shows
; "quad_psram: chip not connected / wrong line mode" and the canvas alloc
; fails. memory_type qio_opi selects the octal-PSRAM bootloader.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
; All of src/ is live AMOLED code now (the M5StickC Plus build and the
; intermediate stage*/bringup scaffolds were removed), so the default
; recursive src filter compiles everything — no per-file switch needed.
; Pinned to the exact versions this firmware was built and hardware-tested
; with (caret ranges let fresh clones float to untested releases — this
; project already ate one build break from a GFX minor bump). Bump
; deliberately, build, test on-device, then update the pin.
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.5
    bitbank2/AnimatedGIF @ 2.2.2
    bblanchon/ArduinoJson @ 7.4.3
    lewisxhe/SensorLib @ 0.2.6
    lewisxhe/XPowersLib @ 0.2.9

; --- Host-side unit tests ---------------------------------------------------
; Pure logic extracted into src/logic/*.h (Arduino-free) is tested on the
; build machine:  pio test -e native
; src/ is NOT compiled for this env (test_build_src defaults to off) — the
; tests include the logic headers directly, so no Arduino stubs are needed.
[env:native]
platform = native